name: CI

on:
  push:
    branches: [main]
  pull_request:

# See windows-determinism.yml: supersede superseded PR runs, never cancel the
# post-merge `main` run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Names the commit this job ran against; on `pull_request` the checkout is
      # the merge commit, so the PR head is printed alongside it.
      - name: CI subject
        shell: bash
        run: |
          echo "ci-subject job=build event=${{ github.event_name }} run_id=${{ github.run_id }}"
          echo "ci-subject checkout_sha=$(git rev-parse HEAD)"
          echo "ci-subject pr_head_sha=${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # The offline property is contractual — the app ships inside the certified MCP
  # payload — so it gets a gate that runs on every pull request rather than a
  # one-off proof in an issue comment. Its own job, not a step in `build`, so the
  # check name says what failed. See tests/network/zero-network.spec.ts.
  zero-network:
    name: zero-network probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CI subject
        shell: bash
        run: |
          echo "ci-subject job=zero-network event=${{ github.event_name }} run_id=${{ github.run_id }}"
          echo "ci-subject checkout_sha=$(git rev-parse HEAD)"
          echo "ci-subject pr_head_sha=${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      # No `|| true`, and the probe itself never skips when a browser is absent:
      # a gate that can quietly not run is worse than no gate.
      - run: npx playwright install --with-deps chromium
      # Builds the default-mode app itself (see playwright.config.ts webServer),
      # so the subject is never a `dist/` left over from another job.
      - run: npm run test:network
