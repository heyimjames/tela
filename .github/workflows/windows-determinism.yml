name: Windows/macOS Determinism

# The determinism suites are the load-bearing cross-platform evidence (v0.3 r2:
# a green suite on the dev platform is not evidence the artifact works on other
# hosts), so they must gate pull requests — before CLI-535 they ran on `push`
# only and a PR could go green having never executed them.
#
# `push` is filtered to `main` so a PR branch push does not run the same matrix
# twice; on a PR branch the `pull_request` event is the single trigger, and the
# post-merge `main` push is the only other run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run when a PR branch is pushed again. Never on `main`:
# a cancelled post-merge run would leave the merged commit without evidence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Identifies the commit this job actually ran against. On `pull_request`
      # the checkout is the merge commit, so both SHAs are printed: the merge
      # commit that was tested and the PR head it was computed from. This line
      # names the subject — it is not evidence that the suite ran; that is the
      # suite's own output below.
      - name: CI subject
        shell: bash
        run: |
          echo "ci-subject job=test-windows event=${{ github.event_name }} run_id=${{ github.run_id }}"
          echo "ci-subject checkout_sha=$(git rev-parse HEAD)"
          echo "ci-subject pr_head_sha=${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          # Literal path, not ${{ env.LOCALAPPDATA }}: the Actions `env` context
          # exposes only workflow/job/step-declared variables, so the runner's
          # own LOCALAPPDATA renders empty and the path collapses to the drive
          # root — a cache that silently stores and restores nothing.
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm test

      # `npm test` above already covers `runEvaluations()` — the vitest wrapper
      # imports it directly. What no suite touches is the *standalone* entry
      # point: the `test:evals` npm alias and the `invokedDirectly` block at the
      # foot of `evaluations/run.mjs` (the argv guard, the stderr progress lines,
      # the JSON report, the non-zero exit). That block's documented failure mode
      # is Windows-specific — `D:` parsed as a URL authority makes the guard
      # false — and its symptom is exit 0 with nothing run, so the report, not
      # the exit code, is the evidence. See scripts/check-evals-report.mjs.
      #
      # `shell: bash` on both platforms so the redirection writes the same bytes;
      # the Windows default shell is pwsh, whose encoding rules differ.
      - name: Standalone evaluation runner (npm alias + CLI entry point)
        shell: bash
        run: |
          npm run --silent test:evals > "$RUNNER_TEMP/evals-report.json" || runner_status=$?
          node scripts/check-evals-report.mjs "$RUNNER_TEMP/evals-report.json"
          exit "${runner_status:-0}"

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: CI subject
        shell: bash
        run: |
          echo "ci-subject job=test-macos event=${{ github.event_name }} run_id=${{ github.run_id }}"
          echo "ci-subject checkout_sha=$(git rev-parse HEAD)"
          echo "ci-subject pr_head_sha=${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm test

      # The POSIX half of the standalone-runner check; see the note in
      # `test-windows`. Both platforms, because the r2 lesson is that a green
      # suite on one platform is not evidence for another, and the measured cost
      # of a full standalone run is ~3s.
      - name: Standalone evaluation runner (npm alias + CLI entry point)
        shell: bash
        run: |
          npm run --silent test:evals > "$RUNNER_TEMP/evals-report.json" || runner_status=$?
          node scripts/check-evals-report.mjs "$RUNNER_TEMP/evals-report.json"
          exit "${runner_status:-0}"
