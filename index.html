<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pyrito D20 mark. The kit's compact treatment is the D20 alone for
         favicons and app icons, and the mark's colours and geometry are fixed:
         `/d20-flat.svg` is the master art (identical polygons, fills and
         linework to the kit's pyrito-d20.svg — asserted in
         src/brand/brand.test.ts), and the PNGs are renderings of it.

         One SVG icon, not a light/dark pair. The dark-scheme icon used to point
         at a bold *redraw* of the mark with the interior facets removed, which
         the kit forbids (`identity.fixed-mark-colors`: no altering the internal
         geometry). Legibility on a dark tab strip is a real cost of dropping it
         and is disclosed on PYR-10; a compliant answer is a rendering of the
         master, not a second drawing of it.

         That redraw is now *deleted*, not merely unlinked: d20-flat-bold.svg,
         d20-bold-16.png, and favicon.ico (whose 16px entry was the redraw) all
         shipped inside the certified payload while nothing referenced them, so
         the forbidden art was still distributed. There is deliberately no
         favicon.ico: agents that request /favicon.ico by convention fall back
         to the SVG icon above, and a 404 on the few that do not beats shipping
         a mark the brand kit forbids. -->
    <link rel="icon" type="image/svg+xml" href="/d20-flat.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/d20-flat-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ink: the app's canvas, so the browser's own chrome matches the surface
         it frames rather than accenting against it. -->
    <meta name="theme-color" content="#0B0F0E" />
    <title>Pyrito Design — a design canvas for social &amp; ad creatives</title>
    <meta name="description" content="Create on-brand creatives for LinkedIn, Instagram, and Facebook. Design once, export to every format. Local-first, no backend required." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
