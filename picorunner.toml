schema = 1
name = "Tela"

[runtime]
kind = "node"
version = "24"
package_manager = "npm"

[[setup.steps]]
kind = "dependencies"
locked = true

[[setup.steps]]
run = ["npm", "run", "build"]

[launch]
command = ["npm", "run", "preview", "--", "--host", "{host}", "--port", "{port}", "--strictPort"]
host = "127.0.0.1"
port = 4331

[health]
type = "http"
path = "/"
timeout_seconds = 90

[persistence]
# Designs and settings use browser localStorage, outside the checkout.
# Preserve optional local configuration; Vite reads these values during the build.
paths = [".env", ".env.local"]
